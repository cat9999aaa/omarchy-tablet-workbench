x}.node.current{border-color:#527d60;background:#20302a}.node-list{display:flex;flex-direction:column;gap:12px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mode{text-align:left;min-height:110px;padding:16px}.mode b{display:block;margin-bottom:9px}.mode span{font-size:12px;line-height:1.65;display:block;color:var(--muted)}.notice{border:1px solid #796442;border-radius:10px;padding:14px 16px;background:#332c21;line-height:1.65;font-size:13px;color:var(--warn)}.notice.error{background:#332327;border-color:#7b4e54;color:var(--bad)}.applybar{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;bottom:-26px;background:var(--surface);padding:16px 0;border-top:1px solid var(--line);margin-top:20px}.applybar p{font-size:13px;color:var(--muted);margin:0}.route-example{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}.route-example:last-child{border:0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.state-row{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.state-row:last-child{border:0}.state-row div{flex:1}.state-row b{display:block;font-size:14px}.state-row small{display:block;margin-top:5px;color:var(--muted);line-height:1.5}.empty{text-align:center;padding:42px 18px}.empty h3{font-size:20px;margin-top:18px}.toggle{display:flex;align-items:center;justify-content:space-between;gap:15px}.toggle input{width:24px;height:24px;accent-color:var(--accent)}.toggle label{min-height:48px;display:flex;align-items:center;gap:12px;width:100%;cursor:pointer}.toggle span{flex:1}.modal-backdrop{position:fixed;inset:0;background:#080c12bb;z-index:5;display:grid;place-items:center;padding:20px}.modal{width:min(470px,100%);background:var(--surface);border:1px solid var(--line);padding:26px;border-radius:18px;box-shadow:0 25px 100px #0008}.modal h2{font-size:21px;margin:0 0 14px}.modal p{font-size:14px;line-height:1.8;color:var(--muted)}.modal-actions{display:flex;gap:10px;margin-top:24px}.modal-actions button{flex:1}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:8;background:var(--accent);color:#15271a;padding:15px 22px;border-radius:10px;font-size:14px;max-width:calc(100% - 40px);box-shadow:0 10px 40px #0006;pointer-events:none}.hidden{display:none!important}.shelved{margin:50px auto;max-width:540px;padding:35px}.shelved button{margin-top:18px}.quick .card{padding:16px}.quick .hero-actions{margin-top:16px}.probe-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button svg{width:18px;height:18px;vertical-align:middle}.page-chip{font-size:12px;color:var(--muted)}.details-box{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,monospace;background:#11161c;border-radius:8px;padding:12px;margin-top:12px}.summary-metric{font-size:24px;margin:14px 0 6px}.subscription-title{display:flex;justify-content:space-between;gap:10px}.focus-note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:16px}

<svg style="display:none" aria-hidden="true"><defs><symbol id="power" viewBox="0 0 24 24"><path d="M12 3v9m-5-7a9 9 0 1 0 10 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol><symbol id="mark" viewBox="0 0 24 24"><path d="m3 7 9-4 9 4v10l-9 4-9-4ZM3 7l9 4 9-4M12 11v10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol></defs></svg>
<header class="lab"><div><strong>交互原型 <span class="good">01</span></strong><div class="small muted">全部为模拟数据 · 不控制本机网络</div></div><div class="lab-controls"><label for="scenario">演示情景</label><select id="scenario" aria-label="演示情景"><option value="connected">正常连接</option><option value="offline">网络断开</option><option value="nodefail">节点切换失败</option><option value="updatefail">更新失败／恢复</option><option value="empty">首次使用／没有节点</option><option value="auth">等待授权</option></select><button id="reset" class="ghost">重置演示</button></div></header>
<div class="app" id="app"><aside class="sidebar"><div class="brand"><svg><use href="#mark"/></svg><div><b>Omarchy</b><span>PROXY WORKBENCH</span></div></div><nav id="nav" aria-label="代理管理页面"></nav><div class="sidebar-bottom"><span class="badge"><span class="dot good"></span> 本地交互演示</span><p>原生体验 · 统一控制<br>桌面和平板，共用一套界面</p></div></aside><section class="workspace"><header class="topbar"><div><h1>代理管理</h1><p>连接清楚，操作简单。</p></div><div class="top-actions"><button id="quickButton" class="ghost"><span class="quick-label">快捷</span>控制</button><button id="collapse" class="ghost" aria-label="收起管理界面">收起 ↓</button></div></header><div class="statusstrip" id="strip" aria-live="polite"></div><main class="content" id="content" tabindex="-1"></main><footer class="footbar"><span>设计预览 · 状态与版本均为演示</span><span>Omarchy → Arch · 保留上一可用配置</span></footer></section></div>
<section id="shelved" class="card shelved hidden"><span class="badge">界面已收起</span><h2>后台状态保留</h2><p id="shelvedState"></p><p>收起只关闭管理界面；停止代理是单独的操作。本页不会控制你的真实网络。</p><button class="primary" id="reopen">重新打开代理管理</button></section><div id="modalRoot"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const pages=[['overview','总览'],['nodes','节点'],['subscriptions','订阅'],['routing','分流'],['updates','更新'],['diagnostics','诊断'],['settings','设置']];
const nodes=[{id:'a',name:'日常使用 · 示例 A',group:'示例订阅',region:'香港',ms:48},{id:'b',name:'备用线路 · 示例 B',group:'示例订阅',region:'东京',ms:82},{id:'c',name:'旅行备用 · 示例 C',group:'示例订阅',region:'新加坡',ms:96}];
const modeNames={rules:'规则分流',global:'全局代理',direct:'全部直连'};
const init=()=>({page:'overview',enabled:true,tun:true,node:'a',mode:'rules',draft:'rules',scenario:'connected',query:'',tested:false,update:'available',subscription:'ready',busy:false,autostart:true,metered:true,advanced:false,details:false});
let s=init(),timer=0,toastTimer=0,modalAction=null,focusBeforeModal=null;
const $=x=>document.getElementById(x);const icon=x=>`<svg aria-hidden="true"><use href="#${x}"/></svg>`;const escape=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function label(){return s.scenario==='empty'?'尚未配置':!s.enabled?'已关闭':s.scenario==='offline'?'等待网络':s.busy?'正在处理':'已连接'}
function nodeName(){return nodes.find(n=>n.id===s.node)?.name||'未选择节点'}
function header(title,desc){return `<div class="sectionhead"><div><h2>${title}</h2><p>${desc}</p></div><span class="badge">模拟数据</span></div>`}
function selectNav(){return `<select class="mobile-nav" aria-label="管理页面" id="mobileNav">${pages.map(([id,name])=>`<option value="${id}" ${s.page===id?'selected':''}>${name}</option>`).join('')}</select>`}
function render(){
 $('nav').innerHTML=pages.map(([id,name],i)=>`<button data-page="${id}" aria-current="${s.page===id?'page':'false'}"><span class="mono small muted">0${i+1}</span>${name}</button>`).join('');
 $('strip').innerHTML=`<span><span class="dot ${s.scenario==='offline'?'bad':'good'}"></span> ${s.scenario==='offline'?'无可用网络':'4G · 物理网络'}</span><span class="${s.enabled&&s.scenario!=='offline'?'good':'warning'}">代理 ${label()}</span><span>${modeNames[s.mode]}</span><span class="status-last muted">TUN ${s.tun&&s.enabled?'开启':'关闭'}</span>`;
 $('content').innerHTML=selectNav()+views[s.page]();bindContent();$('scenario').value=s.scenario;
 document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
 $('shelvedState').textContent='演示中的代理状态：'+label()+'。';
}
function navigate(page){if(s.page==='routing'&&s.draft!==s.mode){dialog('保留未应用的修改？','当前分流修改尚未生效。离开时将放弃这些修改，运行配置保持不变。','放弃修改并离开',()=>{s.draft=s.mode;s.page=page;render();$('content').scrollTop=0});return}s.page=page;render();$('content').scrollTop=0}
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function dialog(title,text,ok,fn,danger=false){focusBeforeModal=document.activeElement;modalAction=fn;$('modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><span class="badge">演示操作</span><h2 id="modalTitle" style="margin-top:15px">${title}</h2><p>${text}</p><div class="modal-actions"><button id="cancelDialog">取消</button><button id="acceptDialog" class="${danger?'danger':'primary'}">${ok}</button></div></section></div>`;$('cancelDialog').onclick=closeDialog;$('acceptDialog').onclick=()=>{const action=modalAction;closeDialog();action()};$('cancelDialog').focus()}
function closeDialog(){$('modalRoot').innerHTML='';modalAction=null;if(focusBeforeModal?.isConnected)focusBeforeModal.focus()}
function actionToggle(){if(s.busy)return;if(s.scenario==='empty'){navigate('subscriptions');return}if(s.enabled)dialog('关闭代理？','演示中的代理与 TUN 将停止，物理网络保留。需要代理的应用可能暂时无法连接。','关闭代理',()=>{s.enabled=false;s.tun=false;render();toast('演示：代理已关闭，不会自动重新开启')},true);else{s.enabled=true;s.tun=true;render();toast('演示：代理已开启')}}
function delayed(fn){clearTimeout(timer);s.busy=true;render();timer=setTimeout(()=>{s.busy=false;fn();render()},650)}
const views={
overview:()=>header('让连接保持简单','常用操作就在这里，详细配置按需展开。')+`<div class="stack">${s.scenario==='offline'?'<div class="notice error">没有可用的物理网络。代理配置已保留，等待你恢复 Wi-Fi 或 4G。<div class="probe-links"><button data-page="diagnostics">查看连接诊断</button><button data-action="recover">模拟网络恢复</button></div></div>':''}${s.scenario==='empty'?'<div class="card empty"><span class="badge">首次使用</span><h3>先添加一组节点</h3><p>导入前会预览内容，确认后才加入配置。</p><button class="primary" data-page="subscriptions">添加示例订阅</button></div>':`<div class="hero card"><div class="hero-main"><div class="power-ring">${icon('power')}</div><div><h2>${label()}</h2><p>${s.enabled?escape(nodeName()):'你的节点和分流设置已保留'}</p></div></div><div class="hero-actions"><button class="${s.enabled?'ghost':'primary'}" data-action="toggle" ${s.busy?'disabled':''}>${s.enabled?'关闭代理':'开启代理'}</button><button class="primary" data-page="nodes">切换节点</button></div><div class="route"><div><b>${s.scenario==='offline'?'未连接':'4G'}</b><small>物理出口</small></div><i>›</i><div><b>${s.tun&&s.enabled?'TUN 接管':'未接管'}</b><small>应用流量</small></div><i>›</i><div><b>${modeNames[s.mode]}</b><small>流量决策</small></div><i>›</i><div><b>${s.mode==='direct'?'直连出口':'所选节点'}</b><small>目标连接</small></div></div></div>`}<div class="grid"><div class="card"><h3>流量怎么走</h3><div class="kv"><span>当前模式</span><b>${modeNames[s.mode]}</b></div><div class="kv"><span>局域网与 ZeroTier</span><b class="good">保持直连</b></div><div class="kv"><span>规则状态</span><b>已验证的示例规则</b></div><button class="wide" data-page="routing">查看和调整分流</button></div><div class="card"><h3>连接检查</h3><div class="kv"><span>物理网络</span><b class="${s.scenario==='offline'?'bad':'good'}">${s.scenario==='offline'?'未连接':'正常'}</b></div><div class="kv"><span>代理路径</span><b>${s.enabled&&s.scenario!=='offline'?'可用（演示）':'未就绪'}</b></div><div class="kv"><span>检查方式</span><b>按需 · 不持续测速</b></div><button class="wide" data-page="diagnostics">打开诊断</button></div></div></div>`,
nodes:()=>header('选一条合适的线路','当前节点置顶。选择新节点后，先检查，再切换。')+`<div class="searchrow"><input id="search" aria-label="搜索示例节点" placeholder="搜索名称或地区" value="${escape(s.query)}"><button data-action="testnodes" ${s.busy?'disabled':''}>${s.busy?'正在检测…':'检测延迟'}</button></div>${s.scenario==='nodefail'?'<div class="notice error" style="margin-bottom:16px">模拟切换失败：旧节点继续使用。可尝试其他节点，不需要重新开启代理。</div>':''}<div class="node-list" id="nodeList">${nodeRows()}</div><p class="focus-note">延迟为演示值，不代表你的线路质量。真实版本只在你点检测时测速，避免消耗 4G 流量。</p>`,
subscriptions:()=>header('订阅与导入','先预览，再加入。更新失败也保留原来的可用节点。')+`<div class="stack">${s.scenario==='empty'?'<div class="card empty"><h3>还没有订阅</h3><p>这里不接收真实订阅地址。用示例预览导入步骤。</p></div>':`<div class="card"><div class="subscription-title"><h3>示例订阅</h3><span class="badge">3 个节点</span></div><p>地址已隐藏 · 内容只保存在本地</p><div class="kv"><span>最近结果</span><b>${s.subscription==='updated'?'更新成功（演示）':'示例数据已载入'}</b></div><div class="kv"><span>自动更新</span><b>按网络条件执行</b></div><button class="wide" data-action="subscription" ${s.busy?'disabled':''}>预览订阅更新</button></div>`}<button class="primary" data-action="import">${s.scenario==='empty'?'预览示例导入':'添加示例订阅'}</button><div class="notice">迁移 v2rayN 配置时，先列出节点、规则和不支持项；不直接覆盖正在使用的配置。</div></div>`,
routing:()=>header('分流，由你决定','改动先保存在编辑区，点“应用修改”后才生效。')+`<div class="stack"><div class="modes">${[['rules','规则分流','按规则选择直连或代理'],['global','全局代理','可代理流量使用所选节点'],['direct','全部直连','公网流量不经过代理节点']].map(([id,name,desc])=>`<button class="mode ${s.draft===id?'selected':''}" data-mode="${id}" aria-pressed="${s.draft===id}"><b>${name}</b><span>${desc}</span></button>`).join('')}</div><div class="card"><h3>这个模式下的示例</h3>${[['本地打印机／局域网','直连'],['ZeroTier 组网','独立直连'],['命中直连规则的网站',s.draft==='global'?'代理':'直连'],['命中代理规则的网站',s.draft==='direct'?'直连':'代理']].map(([a,b])=>`<div class="route-example"><span>${a}</span><b class="${b==='代理'?'warning':'good'}">${b}</b></div>`).join('')}<p>局域网和 ZeroTier 的保护规则在三个模式中保留。真实规则需要结合节点及 DNS 一起验证。</p></div><div class="card"><h3>DNS 与高级规则</h3><p>日常使用保留已验证设置；高级修改会进入单独的编辑与校验流程。</p><button data-action="advanced">${s.advanced?'收起配置说明':'查看配置说明'}</button>${s.advanced?'<div class="details-box">候选配置 → 核心校验 → 连通性验证 → 应用\n失败：保留当前配置\n自定义规则编辑器属于后续实现，本原型仅展示交互边界。</div>':''}</div></div><div class="applybar"><p>${s.draft===s.mode?'当前配置已生效':'有未应用的修改 · 当前仍是 '+modeNames[s.mode]}</p><button class="primary" data-action="apply" ${s.draft===s.mode||s.busy?'disabled':''}>${s.busy?'正在校验…':'应用修改'}</button></div>`,
updates:()=>header('更新，也能安心恢复','程序、核心与规则分别管理，保留上一份可用组合。')+`<div class="stack">${s.update==='failed'?'<div class="notice error">候选核心未通过连接检查。演示中已恢复上一可用版本，代理保持运行。<div class="probe-links"><button data-action="rollback">查看恢复结果</button></div></div>':''}<div class="card">${[['管理程序','当前：原型 01','已是当前演示版本'],['Xray / sing-box',s.update==='installed'?'当前：组合 B（演示）':'当前：已验证组合 A',s.update==='failed'?'已恢复组合 A':s.update==='installed'?'已应用组合 B（演示）':'候选组合 B 待验证'],['分流规则','当前：示例规则集','独立更新，不更换核心']].map(([a,b,c])=>`<div class="state-row"><div><b>${a}</b><small>${b}</small></div><span class="small ${c.includes('恢复')?'warning':'muted'}">${c}</span></div>`).join('')}</div><div class="notice">Omarchy／Arch 更新渠道优先。使用 4G 或电池时可延后大文件下载；飞行模式暂停联网更新。</div><div class="tabs"><button class="primary" data-action="update" ${s.busy?'disabled':''}>${s.busy?'正在验证候选…':'演示候选更新'}</button><button data-action="updateFailure" ${s.busy?'disabled':''}>演示失败与恢复</button></div><p class="focus-note">这里不会下载、安装或更换本机核心。自动版本发现、签名核对、兼容测试与恢复仍属于待实现功能。</p></div>`,
diagnostics:()=>header('问题在哪，一步看清','先看连接链路，再按需要展开技术信息。')+`<div class="card">${[['物理网络',s.scenario==='offline'?'未连接 Wi-Fi 或 4G':'4G 已连接'],['DNS',s.scenario==='offline'?'等待物理网络':'示例解析正常'],['本地代理',s.enabled?'服务已启动':'用户已关闭'],['TUN 接管',s.enabled&&s.tun?'已开启':'已关闭'],['目标连接',s.enabled&&s.scenario!=='offline'?'示例检查通过':'未执行／等待连接']].map(([a,b],i)=>`<div class="state-row"><span class="mono muted">0${i+1}</span><div><b>${a}</b><small>${b}</small></div><span class="${s.scenario==='offline'&&i===0?'bad':'muted'}">${s.scenario==='offline'&&i===0?'检查这里':'·'}</span></div>`).join('')}<button class="wide" data-action="diagnose" ${s.busy?'disabled':''}>${s.busy?'正在模拟检查…':'重新检查（演示）'}</button></div><div class="probe-links"><button data-action="details">${s.details?'收起技术信息':'查看技术信息'}</button></div>${s.details?'<div class="details-box">DEMO ONLY\nphysical: '+(s.scenario==='offline'?'unavailable':'4g')+'\nproxy: '+(s.enabled?'enabled':'user_disabled')+'\n真实节点、订阅、IP 与认证信息不会出现在本演示中。</div>':''}`,
settings:()=>header('保留清楚的默认行为','基础设置直接可用，危险或复杂的改动单独说明。')+`<div class="stack"><div class="card"><h3>运行与流量</h3><div class="toggle"><label><span>登录后恢复上次代理状态</span><input type="checkbox" id="autostart" ${s.autostart?'checked':''}></label></div><div class="toggle"><label><span>使用 4G 时延后大文件更新</span><input type="checkbox" id="metered" ${s.metered?'checked':''}></label></div><p>手动关闭代理后，不被网络恢复或自动任务重新开启。</p></div><div class="card"><h3>TUN 流量接管</h3><div class="kv"><span>当前状态</span><b>${s.tun&&s.enabled?'开启':'关闭'}</b></div><p>关闭 TUN 后，本地代理可以继续运行；应用是否使用代理取决于自己的设置。</p><button data-action="tun">${s.tun?'关闭 TUN':'开启 TUN'}</button></div><div class="card"><h3>隐私与诊断</h3><p>订阅与凭据保留本地；共享诊断前隐藏节点认证信息。原型不保存你在页面中的操作，刷新即可重置。</p></div></div>`
};
function nodeRows(){if(s.scenario==='empty')return '<div class="card empty"><h3>还没有节点</h3><button data-page="subscriptions">前往添加示例订阅</button></div>';const list=[...nodes].sort((a,b)=>(b.id===s.node)-(a.id===s.node)).filter(n=>(n.name+n.region).includes(s.query));return list.length?list.map(n=>`<div class="card node ${n.id===s.node?'current':''}"><div class="letter">${n.id.toUpperCase()}</div><div class="detail"><h3>${n.name}</h3><p>${n.region} · ${n.group}${n.id===s.node?' · 当前使用':''}</p></div><div class="latency ${n.id===s.node?'good':''}">${s.tested?n.ms+' ms':'未检测'}<small>示例延迟</small></div><button data-node="${n.id}" ${n.id===s.node||s.busy?'disabled':''}>${n.id===s.node?'使用中':'使用此节点'}</button></div>`).join(''):'<div class="card empty"><h3>没有匹配的节点</h3><p>试试名称或地区，也可以清空搜索。</p></div>'}
function bindContent(){const m=$('mobileNav');if(m)m.onchange=()=>navigate(m.value);const input=$('search');if(input)input.oninput=()=>{s.query=input.value;$('nodeList').innerHTML=nodeRows();bindNodes()};bindNodes();document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{s.draft=b.dataset.mode;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));for(const k of ['autostart','metered'])if($(k))$(k).onchange=()=>{s[k]=$(k).checked;toast('演示设置已更改，刷新后重置')}}
function bindNodes(){document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{if(s.scenario==='offline'){toast('演示：没有物理网络，保持原节点');return}const target=b.dataset.node;delayed(()=>{if(s.scenario==='nodefail'){toast('模拟切换失败，原节点继续使用')}else{s.node=target;toast('演示：节点已切换')}})})}
function act(a){if(a==='toggle')return actionToggle();if(a==='recover'){s.scenario='connected';render();toast('演示：物理网络已恢复');return}if(a==='testnodes')return delayed(()=>{s.tested=true;toast('演示延迟已更新，未产生测速流量')});if(a==='advanced'){s.advanced=!s.advanced;render();return}if(a==='apply'){if(s.scenario==='auth')return dialog('需要系统授权','真实版本会由系统显示授权窗口。这里仅模拟取消后的状态，旧配置保持有效。','模拟取消授权',()=>toast('演示：授权取消，修改尚未应用'));return delayed(()=>{s.mode=s.draft;toast('演示：分流配置已应用')})}if(a==='import'||a==='subscription')return dialog(a==='import'?'预览示例导入':'预览示例更新','发现 3 个示例节点，规则保持不变。没有真实订阅地址或凭据，本操作仅用于验证预览流程。','确认示例内容',()=>{s.scenario='connected';s.subscription='updated';render();toast('演示内容已加入')});if(a==='update'||a==='updateFailure')return dialog('验证候选核心组合','真实更新可能需要短暂重建连接。本次只展示候选验证与恢复状态，不下载任何内容。','开始演示',()=>delayed(()=>{s.update=a==='updateFailure'||s.scenario==='updatefail'?'failed':'installed';toast(s.update==='failed'?'模拟验证失败，已恢复原组合':'模拟更新完成')}));if(a==='rollback')return dialog('恢复结果','候选组合 B 已撤销。当前重新使用已验证组合 A 和原配置；演示代理状态保持不变。','知道了',()=>{});if(a==='diagnose')return delayed(()=>toast(s.scenario==='offline'?'演示：问题在物理网络，先连接 Wi-Fi 或 4G':'演示检查已完成'));if(a==='details'){s.details=!s.details;render();return}if(a==='tun'){if(!s.enabled){toast('请先开启演示代理');return}return dialog(s.tun?'关闭 TUN？':'开启 TUN？',s.tun?'本地代理仍运行，但未配置代理的应用可能改为直连或无法连接。':'将模拟接管应用流量，保留局域网与 ZeroTier 旁路。','确认',()=>{s.tun=!s.tun;render()})}}
function setScenario(value){clearTimeout(timer);closeDialog();s=init();s.scenario=value;if(value==='updatefail'){s.page='updates';s.update='failed'}if(value==='nodefail')s.page='nodes';if(value==='auth'){s.page='routing';s.draft='global'}if(value==='empty'){s.enabled=false;s.tun=false}render();$('content').scrollTop=0}
$('scenario').onchange=e=>setScenario(e.target.value);$('reset').onclick=()=>{setScenario('connected');$('app').classList.remove('hidden');$('shelved').classList.add('hidden');toast('已恢复初始演示状态')};$('collapse').onclick=()=>{if(s.page==='routing'&&s.draft!==s.mode)return dialog('收起前放弃修改？','分流改动尚未应用，当前运行配置不会改变。','放弃并收起',()=>{s.draft=s.mode;shelve()});shelve()};function shelve(){$('app').classList.add('hidden');$('shelved').classList.remove('hidden');$('shelvedState').textContent='演示中的代理状态：'+label()+'。';$('reopen').focus()}$('reopen').onclick=()=>{$('app').classList.remove('hidden');$('shelved').classList.add('hidden');render()};$('quickButton').onclick=()=>{focusBeforeModal=document.activeElement;$('modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal quick" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><span class="badge">快捷控制 · 模拟数据</span><h2 id="modalTitle" style="margin-top:16px">${label()}</h2><p>${nodeName()}<br>${modeNames[s.mode]} · TUN ${s.tun&&s.enabled?'开启':'关闭'}</p><div class="hero-actions"><button id="quickToggle">${s.enabled?'关闭代理':'开启代理'}</button><button id="quickNodes">切换节点</button></div><button id="quickClose" class="wide" style="width:100%;margin-top:12px">返回管理界面</button></section></div>`;$('quickClose').onclick=closeDialog;$('quickToggle').onclick=()=>{closeDialog();actionToggle()};$('quickNodes').onclick=()=>{closeDialog();navigate('nodes')};$('quickClose').focus()};
document.addEventListener('keydown',e=>{const modal=$('modalRoot').querySelector('.modal');if(!modal)return;if(e.key==='Escape'){e.preventDefault();closeDialog()}if(e.key==='Tab'){const list=[...modal.querySelectorAll('button, input, select, [tabindex]')].filter(x=>!x.disabled);const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();
</script></body></html>
