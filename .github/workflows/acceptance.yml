name: Software acceptance

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Install test-only Qt dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools libudev-dev gdb \
            qml6-module-qttest qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-templates qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtqml-workerscript
      - name: Run isolated software checks
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          unset DBUS_SESSION_BUS_ADDRESS DISPLAY WAYLAND_DISPLAY
          python3 scripts/acceptance/run.py --output "$RUNNER_TEMP/workbench-acceptance"
      - name: Capture shared QML crash backtrace
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          unset DBUS_SESSION_BUS_ADDRESS DISPLAY WAYLAND_DISPLAY
          timeout 45s gdb --batch -ex 'set pagination off' -ex run -ex 'thread apply all bt' --args /usr/lib/qt6/bin/qmltestrunner -input modules/workbench-ui/tests/tst_presentation.qml > "$RUNNER_TEMP/workbench-acceptance/shared-qml-backtrace.log" 2>&1
      - name: Keep software acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: software-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/workbench-acceptance
          if-no-files-found: error
          retention-days: 14

  map-gps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Install native adapter build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build qt6-base-dev qt6-positioning-dev
      - name: Build and check private GPS adapter
        run: |
          unset DBUS_SESSION_BUS_ADDRESS DISPLAY WAYLAND_DISPLAY
          cmake -S modules/map-gps-adapter -B "$RUNNER_TEMP/map-gps" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/map-gps" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/map-gps" --no-tests=error --output-on-failure --timeout 45 --output-junit "$RUNNER_TEMP/map-gps/results.xml"
          ctest --test-dir "$RUNNER_TEMP/map-gps" -R '^plugin_factory$' --no-tests=error --repeat until-fail:30 --output-on-failure
          (cd modules/map-gps-adapter && python3 -m unittest -v test_launch)
      - name: Keep adapter test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: map-gps-acceptance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/map-gps/results.xml
            ${{ runner.temp }}/map-gps/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 14
